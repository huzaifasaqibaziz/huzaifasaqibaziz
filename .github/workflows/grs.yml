# Generates stats SVGs into this profile repo (official recommended approach).
# Docs: https://github.com/anuraghazra/github-readme-stats#github-actions
# Action: https://github.com/marketplace/actions/github-readme-stats-action

name: Update README cards

on:
  schedule:
    # Daily 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=dark&hide_border=true&bg_color=0c0b0a&title_color=ff8a3d&icon_color=ff8a3d&text_color=d4d0c8&ring_color=ff8a3d
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=dark&hide_border=true&bg_color=0c0b0a&title_color=ff8a3d&text_color=d4d0c8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p profile
          git add profile/*.svg
          git commit -m "chore: update GitHub README stats cards" || exit 0
          git push
